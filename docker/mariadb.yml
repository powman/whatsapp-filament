
services:
  mariadb:
    container_name: laravel_mariadb
    image: mariadb
    restart: always
    command: 
       --default-authentication-plugin=mysql_native_password
       --lower_case_table_names=1
    environment:
      MARIADB_ROOT_PASSWORD: FSFS123FFSRvvvgFD
      MARIADB_DATABASE: laravel
      TZ: "America/Sao_Paulo"
    volumes:
       - ./.cachedb:/var/lib/mysql:delegated
    ports: 
      - "3306:3306"