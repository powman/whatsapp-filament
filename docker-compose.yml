services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: whatsapp_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - whatsapp_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: whatsapp_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
      - ./public:/var/www/html/public:ro
    networks:
      - whatsapp_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: whatsapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-whatsapp_filament}
      MYSQL_USER: ${DB_USERNAME:-whatsapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - whatsapp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - whatsapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: whatsapp_queue
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - whatsapp_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  app_storage:

networks:
  whatsapp_network:
    driver: bridge
